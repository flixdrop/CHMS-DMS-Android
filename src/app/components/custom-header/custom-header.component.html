<ion-toolbar>
  @if (isSearchbarVisible() === false) {
    <ion-back-button slot="start" icon="chevron-back" defaultHref="/landing/tabs/home" text=""></ion-back-button>
     <!-- <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="chevron-back" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons> -->
    <ion-title>
      {{ title() | translate }}
    </ion-title>
  }
  
  @if (isSearchbarVisible() === true) {
    <ion-buttons slot="start">
      <ion-button (click)="onCloseSearchbar()">
        <ion-icon name="chevron-forward" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  }

  @if (isSearchbarVisible() === true) {
    <ion-searchbar show-clear-button="always"
      class="search-input" 
      [value]="searchValue()" 
      searchIcon="search-circle"
      [placeholder]="searchPlaceholder() | translate" 
      (ionInput)="handleInput($event)" color="light">
    </ion-searchbar>
  }

  @if (isSearchbarVisible() === false) {
    <ion-buttons slot="end">
      <ion-button (click)="onClickSearchIcon()">
        <ion-icon name="search" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  }
  
  @if (isLoading()) {
    <ion-progress-bar type="indeterminate" name="lines-sharp"></ion-progress-bar>
  }
</ion-toolbar>
