<div class="recovery-container">
  
  <div class="form-card">
    <h3>Direct Password Reset</h3>
    <p>Provide your user details along with your desired new password to update your account immediately.</p>
    
    <!-- User Identifier -->
    <div class="input-group">
      <input [(ngModel)]="identifier" placeholder="Username, email, or contact number" autocomplete="off" />
    </div>

    <!-- New Credentials Input -->
    <div class="input-group">
      <input type="password" [(ngModel)]="newPassword" placeholder="New Password" />
    </div>

    <!-- Confirmation Input -->
    <div class="input-group">
      <input type="password" [(ngModel)]="confirmPassword" placeholder="Confirm New Password" />
    </div>

    <button [disabled]="processing" (click)="onDirectPasswordReset()">
      {{ processing ? 'Applying Changes...' : 'Reset Password Instantly' }}
    </button>
  </div>

</div>
